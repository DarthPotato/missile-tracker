name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate data
        run: npm run validate
      - name: Check every quote against its source page
        if: github.event_name == 'pull_request'
        run: npm run validate -- --quotes
      - run: npm test
      - run: npm run check
      - run: npm run build
