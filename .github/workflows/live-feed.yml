name: Live feed

# Every 6 hours: read the Telegram channels and news queries in
# data/live/sources.json, log intercept counts with Claude Haiku, commit
# data/live/ and redeploy. Published without review by design: the site labels
# these figures unverified and keeps them out of the stockpile numbers.
# Turn it off by setting the repository variable LIVE_FEED to 0.
# To fill in history, run it by hand with "backfill days" set (say 30): it
# re-reads that many days of every Telegram channel. Events already logged are
# merged, not duplicated.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Re-read this many days of Telegram history (0 = a normal run)"
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: live-feed

jobs:
  update:
    # format() turns an unset variable into '', so the feed runs unless LIVE_FEED is exactly 0.
    # (A bare vars.LIVE_FEED != '0' skips when it is unset: GitHub compares null and '0' as numbers.)
    if: format('{0}', vars.LIVE_FEED) != '0'
    runs-on: ubuntu-latest
    # A normal run takes a couple of minutes; a 30-day backfill can take half an hour.
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read sources and log intercepts
        run: npm run live-feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_BING_NEWS: ${{ vars.USE_BING_NEWS || '1' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
      - name: Show summary
        if: always()
        run: cat pipeline-out/live-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        id: commit
        run: |
          git add data/live/events.json data/live/state.json data/live/drone-claims.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Live feed update"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
