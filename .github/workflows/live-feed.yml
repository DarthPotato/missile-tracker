name: Live feed

# About every 6 hours: read the Telegram channels and news queries in
# data/live/sources.json, log intercept counts with Claude Haiku, commit
# data/live/ and redeploy. Published without review by design: the site labels
# these figures unverified and keeps them out of the stockpile numbers.
# Turn it off by setting the repository variable LIVE_FEED to 0.
# To fill in history, run it by hand with "backfill days" set (say 30): it
# re-reads that many days of every Telegram channel. Events already logged are
# merged, not duplicated. Set "backfill scope" to claims to look only for U.S.
# drone and jet shoot-down claims: far fewer model calls, and the intercept
# channels' bookmarks are left alone.
#
# GitHub starts this repository's scheduled runs hours late and can drop them
# under load, so a plain 6-hour schedule can leave long gaps. Instead the
# schedule ticks every hour, and the gate job lets a tick through only when the
# last update (the "updated" time in data/live/events.json, written on every run)
# is at least MIN_GAP_MINUTES old. Late or dropped ticks then cost at most an
# hour, two delayed ticks arriving together still make one run, and the model
# is called about as often as before. Runs started by hand always go through.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Re-read this many days of Telegram history (0 = a normal run)"
        default: "0"
      backfill_scope:
        description: "What a backfill looks for"
        type: choice
        options: [all, claims]
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: live-feed

jobs:
  gate:
    # format() turns an unset variable into '', so the feed runs unless LIVE_FEED is exactly 0.
    # (A bare vars.LIVE_FEED != '0' skips when it is unset: GitHub compares null and '0' as numbers.)
    if: format('{0}', vars.LIVE_FEED) != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MIN_GAP_MINUTES: 330
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          updated=$(gh api "repos/${{ github.repository }}/contents/data/live/events.json?ref=main" \
            -H "Accept: application/vnd.github.raw" | jq -r '.updated // empty') || updated=""
          if [ -z "$updated" ]; then echo "No last-update time found, running."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$updated" +%s) ) / 60 ))
          echo "Last update $updated, $age minutes ago (running after $MIN_GAP_MINUTES)."
          if [ "$age" -ge "$MIN_GAP_MINUTES" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # A normal run takes a couple of minutes; a 30-day backfill can take half an hour,
    # and a backfill to the start of the war (busy channels, ~1.5 s a page) up to two hours.
    timeout-minutes: ${{ (inputs.backfill_days || '0') != '0' && 150 || 60 }}
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the commit can be rebased onto a newer main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read sources and log intercepts
        run: npm run live-feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_BING_NEWS: ${{ vars.USE_BING_NEWS || '1' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '0' }}
          BACKFILL_SCOPE: ${{ inputs.backfill_scope || 'all' }}
      - name: Show summary
        if: always()
        run: cat pipeline-out/live-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit
        id: commit
        run: |
          git add data/live/events.json data/live/state.json data/live/drone-claims.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Live feed update"
          # main may have moved while the run read Telegram (a backfill takes hours), and a
          # plain push would then be refused and the run's results lost. Rebase onto the
          # latest main and push, trying a few times in case someone merges meanwhile.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && pushed=1 && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          [ "${pushed:-}" = 1 ] || { echo "Could not push the update to main"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
